plugins {
    id 'com.android.application'
}

android {
    namespace 'com.conectiontv'
    compileSdk 35

    defaultConfig {
        applicationId 'com.conectiontv'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }
}
